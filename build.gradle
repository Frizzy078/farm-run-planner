plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	testImplementation 'junit:junit:4.13.2'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.farmplanner'
version = '1.0.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// Start RuneLite met deze plugin erin (developer mode): ./gradlew runClient
tasks.register('runClient', JavaExec) {
	group = 'application'
	description = 'Start RuneLite in developer mode met de Farm Run Planner plugin'
	classpath = sourceSets.test.runtimeClasspath
	mainClass.set('com.farmplanner.FarmPlannerPluginTest')
	jvmArgs '-ea'
	args '--developer-mode'
}
